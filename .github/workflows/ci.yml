name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check mcp/personal-vault-server.mjs && node --check scripts/scan-secrets.mjs
      - name: Contract tests (temporary fixtures)
        run: npm test
      - name: Secret scan (working tree)
        run: npm run scan:secrets
      - name: Secret scan (git history)
        run: npm run scan:secrets:history
